<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HERE WE GO | Football Transfers</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, Helvetica, sans-serif;
            color: #ffffff;

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(0, 140, 255, 0.22),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 100% 100%,
                    rgba(0, 80, 255, 0.12),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #000000 0%,
                    #02050a 45%,
                    #000000 100%
                );

            overflow-x: hidden;
        }

        body::before {
            content: "";

            position: fixed;
            top: -280px;
            left: 50%;

            width: 650px;
            height: 650px;

            transform: translateX(-50%);
            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(0, 140, 255, 0.18),
                    transparent 70%
                );

            filter: blur(30px);
            pointer-events: none;
            z-index: -1;

            animation: blueGlow 8s ease-in-out infinite;
        }

        body::after {
            content: "";

            position: fixed;
            top: -35%;
            left: -20%;

            width: 4px;
            height: 170%;

            background:
                linear-gradient(
                    to bottom,
                    transparent,
                    rgba(0, 140, 255, 0.05),
                    #008cff,
                    rgba(0, 140, 255, 0.05),
                    transparent
                );

            filter: blur(2px);
            opacity: 0.7;

            transform: rotate(24deg);

            pointer-events: none;
            z-index: -1;

            animation: neonBeam 10s linear infinite;
        }

        .container {
            position: relative;
            z-index: 2;

            width: min(96%, 1800px);
            margin: auto;

            padding: 35px 0 80px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
            margin-bottom: 45px;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 9px;

            padding: 14px 28px;

            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #034694,
                    #0879db
                );

            border: 1px solid rgba(255,255,255,0.28);
            border-radius: 50px;

            text-decoration: none;

            font-size: 16px;
            font-weight: 800;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.55),
                0 0 20px rgba(0,120,255,0.28),
                inset 0 1px 1px rgba(255,255,255,0.25);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .home-btn:hover {
            transform: translateY(-4px) scale(1.04);

            box-shadow:
                0 18px 45px rgba(0,0,0,0.75),
                0 0 35px rgba(0,140,255,0.75);
        }

        .label {
            padding: 10px 20px;

            color: #b5dcff;

            background: rgba(255,255,255,0.055);

            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 50px;

            font-size: 12px;
            font-weight: 800;

            letter-spacing: 2px;
            text-transform: uppercase;

            backdrop-filter: blur(15px);
        }

        .header {
            text-align: center;
            margin-bottom: 55px;
        }

        .header-icon {
            display: inline-block;

            font-size: 76px;
            margin-bottom: 18px;

            filter:
                drop-shadow(
                    0 12px 30px
                    rgba(0,0,0,0.8)
                );

            animation:
                floatIcon
                4s
                ease-in-out
                infinite;
        }

        .header h1 {
            font-size: clamp(45px, 7vw, 95px);

            font-weight: 1000;

            letter-spacing: 6px;
            line-height: 1;

            text-transform: uppercase;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #55b9ff,
                    #ffffff,
                    #55b9ff,
                    #ffffff
                );

            background-size: 300% auto;

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            animation:
                titleShine
                7s
                linear
                infinite;

            text-shadow:
                0 15px 40px
                rgba(0,0,0,0.8);
        }

        .header p {
            margin-top: 22px;

            color: #a2bed7;

            font-size: 16px;

            letter-spacing: 3px;

            text-transform: uppercase;

            font-weight: 600;
        }

        .header-line {
            width: 300px;
            height: 4px;

            margin: 30px auto 0;

            border-radius: 50px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #008cff,
                    #ffffff,
                    #008cff,
                    transparent
                );

            box-shadow:
                0 0 25px
                rgba(0,140,255,0.85);
        }

        .gallery {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );

            gap: 28px;
        }

        .photo-card {
            position: relative;

            padding: 10px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.095),
                    rgba(255,255,255,0.025)
                );

            border: 1px solid rgba(255,255,255,0.15);

            border-radius: 22px;

            overflow: hidden;

            backdrop-filter: blur(18px);

            box-shadow:
                0 25px 60px rgba(0,0,0,0.65),
                inset 0 1px 1px rgba(255,255,255,0.12);

            cursor: pointer;

            transition:
                transform 0.4s ease,
                border-color 0.4s ease,
                box-shadow 0.4s ease;
        }

        .photo-card:hover {
            transform:
                translateY(-10px)
                scale(1.015);

            border-color: #008cff;

            box-shadow:
                0 30px 70px rgba(0,0,0,0.8),
                0 0 35px rgba(0,140,255,0.35);
        }

        .photo-card img {
            display: block;

            width: 100%;
            height: auto;

            aspect-ratio: 4 / 3;

            object-fit: cover;

            border-radius: 15px;

            image-rendering: auto;

            transition:
                transform 0.5s ease,
                filter 0.5s ease;
        }

        .photo-card:hover img {
            transform: scale(1.055);

            filter:
                brightness(1.08)
                contrast(1.05)
                saturate(1.05);
        }

        .photo-number {
            position: absolute;

            left: 22px;
            bottom: 22px;

            padding: 8px 13px;

            color: #ffffff;

            background: rgba(0,0,0,0.76);

            border:
                1px solid
                rgba(0,140,255,0.35);

            border-radius: 9px;

            font-size: 11px;

            font-weight: 900;

            letter-spacing: 1px;

            backdrop-filter: blur(10px);

            box-shadow:
                0 0 15px
                rgba(0,140,255,0.12);
        }

        .photo-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: -120%;

            width: 65%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.18),
                    transparent
                );

            transform: skewX(-25deg);

            transition:
                left 0.8s ease;

            z-index: 3;

            pointer-events: none;
        }

        .photo-card:hover::before {
            left: 140%;
        }

        footer {
            margin-top: 65px;

            padding-top: 28px;

            text-align: center;

            border-top:
                1px solid
                rgba(255,255,255,0.10);

            color: #70869c;

            font-size: 11px;

            letter-spacing: 3px;

            text-transform: uppercase;
        }

        .lightbox {
            position: fixed;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 30px;

            background: rgba(0,0,0,0.94);

            backdrop-filter: blur(14px);

            z-index: 9999;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 95vw;
            max-height: 90vh;

            object-fit: contain;

            border-radius: 14px;

            box-shadow:
                0 0 70px
                rgba(0,120,255,0.30);
        }

        .close-lightbox {
            position: absolute;

            top: 25px;
            right: 30px;

            width: 48px;
            height: 48px;

            border:
                1px solid
                rgba(255,255,255,0.2);

            border-radius: 50%;

            background:
                rgba(255,255,255,0.08);

            color: white;

            font-size: 28px;

            cursor: pointer;

            transition: 0.3s ease;
        }

        .close-lightbox:hover {
            background:
                rgba(0,120,255,0.25);

            box-shadow:
                0 0 25px
                rgba(0,140,255,0.45);
        }

        @keyframes blueGlow {
            0%, 100% {
                opacity: 0.45;

                transform:
                    translateX(-50%)
                    scale(1);
            }

            50% {
                opacity: 1;

                transform:
                    translateX(-50%)
                    scale(1.25);
            }
        }

        @keyframes neonBeam {
            0% {
                left: -20%;
                opacity: 0;
            }

            20% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }

            80% {
                opacity: 0.45;
            }

            100% {
                left: 120%;
                opacity: 0;
            }
        }

        @keyframes floatIcon {
            0%, 100% {
                transform:
                    translateY(0)
                    rotate(0deg);
            }

            50% {
                transform:
                    translateY(-12px)
                    rotate(5deg);
            }
        }

        @keyframes titleShine {
            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 300% center;
            }
        }

        @media (max-width: 900px) {
            .gallery {
                grid-template-columns:
                    repeat(
                        2,
                        minmax(0, 1fr)
                    );

                gap: 18px;
            }
        }

        @media (max-width: 600px) {
            .container {
                width: 92%;
                padding-top: 20px;
            }

            .top-bar {
                margin-bottom: 35px;
            }

            .label {
                display: none;
            }

            .header {
                margin-bottom: 40px;
            }

            .header-icon {
                font-size: 50px;
            }

            .header h1 {
                font-size: 38px;
                letter-spacing: 2px;
            }

            .header p {
                font-size: 10px;
                line-height: 1.8;
                letter-spacing: 2px;
            }

            .header-line {
                width: 170px;
            }

            .gallery {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .photo-card {
                padding: 7px;
                border-radius: 17px;
            }

            .photo-card img {
                border-radius: 11px;
            }

            .photo-number {
                left: 15px;
                bottom: 15px;
            }

            .home-btn {
                padding: 11px 21px;
                font-size: 14px;
            }

            .lightbox {
                padding: 15px;
            }

            .close-lightbox {
                top: 15px;
                right: 15px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="top-bar">

            <a href="!DOCTYPE2.html" class="home-btn">
                🏠 Home
            </a>

            <div class="label">
                Football Transfers
            </div>

        </div>

        <header class="header">

            <div class="header-icon">
                ⚽
            </div>

            <h1>
                HERE WE GO
            </h1>

            <p>
                Football • Player • Next Year Club
            </p>

            <div class="header-line"></div>

        </header>

        <section class="gallery" id="gallery">

            <!--
                ALL 171 PLAYERS
                JavaScript below automatically displays:
                190 → 189 → 188 → ... → 2 → 1
            -->

        </section>

        <footer>
            ⚽ HERE WE GO • FOOTBALL • PLAYER • NEXT YEAR CLUB ⚽
        </footer>

    </div>

    <div class="lightbox" id="lightbox">

        <button
            class="close-lightbox"
            id="closeLightbox"
            aria-label="Close image"
        >
            ×
        </button>

        <img
            id="lightboxImage"
            src=""
            alt="Football player"
        >

    </div>

    <script>

        /* =====================================================
           CREATE ALL 190 PLAYER CARDS
           ===================================================== */

        const gallery = document.getElementById("gallery");

        for (let i = 190; i >= 1; i--) {

            const card = document.createElement("div");

            card.className = "photo-card";

            card.innerHTML = `
                <img
                    src="${String(i).padStart(2, "0")}.png"
                    alt="Football player transfer ${i}"
                    loading="lazy"
                >

                <div class="photo-number">
                    PLAYER #${String(i).padStart(2, "0")}
                </div>
            `;

            gallery.appendChild(card);
        }


        /* =====================================================
           FULL SCREEN IMAGE VIEWER
           ===================================================== */

        const photoCards =
            document.querySelectorAll(".photo-card");

        const lightbox =
            document.getElementById("lightbox");

        const lightboxImage =
            document.getElementById("lightboxImage");

        const closeLightbox =
            document.getElementById("closeLightbox");


        /* OPEN IMAGE */

        photoCards.forEach(card => {

            card.addEventListener("click", () => {

                const image =
                    card.querySelector("img");

                lightboxImage.src =
                    image.src;

                lightboxImage.alt =
                    image.alt;

                lightbox.classList.add("active");

                document.body.style.overflow =
                    "hidden";
            });

        });


        /* CLOSE IMAGE */

        function closeViewer() {

            lightbox.classList.remove("active");

            lightboxImage.src = "";

            document.body.style.overflow = "";
        }


        closeLightbox.addEventListener(
            "click",
            closeViewer
        );


        /* CLICK OUTSIDE IMAGE */

        lightbox.addEventListener(
            "click",
            event => {

                if (
                    event.target === lightbox
                ) {
                    closeViewer();
                }

            }
        );


        /* ESC KEY */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Escape" &&
                    lightbox.classList.contains("active")
                ) {
                    closeViewer();
                }

            }
        );

    </script>

</body>

</html>
